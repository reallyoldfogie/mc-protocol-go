# Minecraft Protocol Generator Configuration

# Minecraft versions to generate code for
versions:
  - "1.21.1"
  - "1.21.2"
  - "1.21.3"
  - "1.21.4"
  - "1.21.5"
  - "1.21.6"
  - "1.21.7"
  - "1.21.8"
  - "1.21.9"
  - "1.21.10"
  - "26.1-snapshot-1"

# Output directory settings
output:
  data_dir: "data"  # Generated Go packages will be placed here

# Cache settings
cache:
  cache_dir: ".cache"              # Index files mapping keys to file paths
  metadata_dir: ".cache/metadata"  # Downloaded and extracted Minecraft data
  ttl_days: 90                      # Number of days before cache expires

# Memory optimization settings
memory:
  gc_percent: 50         # More aggressive GC (lower = more frequent)
  memory_limit: "512MiB" # Soft memory limit
  max_procs: 2           # Maximum number of OS threads
